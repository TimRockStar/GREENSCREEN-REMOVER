<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fond Vert Gratuit — Retire et remplace ton arrière-plan</title>
<style>
  :root{
    --bg:#15161C;--card:#1E2029;--card2:#252732;--border:#32343F;
    --text:#F4F5F7;--sub:#9CA0AE;
    --accent:#1D9E75;--accent-bg:rgba(29,158,117,0.12);
  }
  *{box-sizing:border-box;}
  body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);margin:0;line-height:1.5;}
  .wrap{max-width:460px;margin:0 auto;padding:1.5rem 1.25rem 3rem;}
  h1{font-size:18px;font-weight:800;margin-bottom:4px;}
  .sub{font-size:12.5px;color:var(--sub);margin-bottom:1.5rem;}
  .step{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1rem;margin-bottom:1rem;}
  .step-title{font-size:13px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
  .step-num{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;}
  input[type="file"]{width:100%;font-size:12px;color:var(--sub);}
  .btn{width:100%;padding:12px;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;margin-top:8px;}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}
  .btn-outline{background:none;border:1px solid var(--border);color:var(--text);}
  .slider-row{margin-top:10px;}
  .slider-row label{font-size:11.5px;color:var(--sub);display:block;margin-bottom:4px;}
  input[type="range"]{width:100%;}
  canvas{width:100%;border-radius:10px;background:#000;display:block;margin-top:10px;}
  video{display:none;}
  .status{font-size:12px;color:var(--sub);text-align:center;margin-top:8px;min-height:16px;}
  .color-swatches{display:flex;gap:8px;margin-top:8px;}
  .swatch{width:32px;height:32px;border-radius:8px;cursor:pointer;border:2px solid transparent;}
  .swatch.sel{border-color:var(--accent);}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎬 Retire ton fond vert</h1>
  <div class="sub">Retire l'arrière-plan vert, ajoute une nouvelle image, exporte — gratuit, sans filigrane.</div>

  <div class="step">
    <div class="step-title"><span class="step-num">1</span> Ta vidéo avec fond vert</div>
    <input type="file" id="video-input" accept="video/*"/>
    <video id="src-video" playsinline muted></video>
  </div>

  <div class="step">
    <div class="step-title"><span class="step-num">2</span> Nouvel arrière-plan</div>
    <input type="file" id="bg-input" accept="image/*"/>
    <div style="font-size:11px;color:var(--sub);margin-top:8px;">Ou choisis une couleur unie :</div>
    <div class="color-swatches">
      <div class="swatch sel" data-color="#000000" style="background:#000;"></div>
      <div class="swatch" data-color="#FFFFFF" style="background:#fff;"></div>
      <div class="swatch" data-color="#1D9E75" style="background:#1D9E75;"></div>
      <div class="swatch" data-color="#378ADD" style="background:#378ADD;"></div>
      <div class="swatch" data-color="#D85A30" style="background:#D85A30;"></div>
    </div>
  </div>

  <div class="step">
    <div class="step-title"><span class="step-num">3</span> Ajuste la sensibilité du vert</div>
    <div class="slider-row">
      <label>Sensibilité (si des restes de vert apparaissent, augmente)</label>
      <input type="range" id="sensitivity" min="20" max="120" value="60"/>
    </div>
    <canvas id="preview-canvas"></canvas>
    <div class="status" id="preview-status">Charge ta vidéo pour voir l'aperçu.</div>
  </div>

  <button class="btn" id="export-btn" disabled>📥 Exporter la vidéo finale</button>
  <div class="status" id="export-status"></div>
</div>

<script>
var srcVideo = document.getElementById('src-video');
var previewCanvas = document.getElementById('preview-canvas');
var ctx = previewCanvas.getContext('2d');
var offCanvas = document.createElement('canvas');
var offCtx = offCanvas.getContext('2d', { willReadFrequently: true });

var bgImage = null;
var bgColor = '#000000';
var videoReady = false;
var animFrameId = null;

document.getElementById('video-input').addEventListener('change', function(e){
  var file = e.target.files[0];
  if(!file) return;
  srcVideo.src = URL.createObjectURL(file);
  srcVideo.loop = true;
  srcVideo.onloadedmetadata = function(){
    previewCanvas.width = srcVideo.videoWidth;
    previewCanvas.height = srcVideo.videoHeight;
    offCanvas.width = srcVideo.videoWidth;
    offCanvas.height = srcVideo.videoHeight;
    srcVideo.play();
    videoReady = true;
    document.getElementById('export-btn').disabled = false;
    document.getElementById('preview-status').textContent = 'Aperçu en direct — ajuste la sensibilité si besoin.';
    startPreviewLoop();
  };
});

document.getElementById('bg-input').addEventListener('change', function(e){
  var file = e.target.files[0];
  if(!file) return;
  var img = new Image();
  img.onload = function(){ bgImage = img; };
  img.src = URL.createObjectURL(file);
});

document.querySelectorAll('.swatch').forEach(function(sw){
  sw.addEventListener('click', function(){
    document.querySelectorAll('.swatch').forEach(function(s){ s.classList.remove('sel'); });
    sw.classList.add('sel');
    bgColor = sw.dataset.color;
    bgImage = null;
  });
});

function applyChromaKey(imageData, sensitivity){
  var data = imageData.data;
  for(var i = 0; i < data.length; i += 4){
    var r = data[i], g = data[i+1], b = data[i+2];
    // Vert dominant = fond à retirer. La sensibilité ajuste à quel point le vert
    // doit dominer le rouge et le bleu pour être considéré comme fond.
    if(g > r + sensitivity/2 && g > b + sensitivity/2 && g > 60){
      data[i+3] = 0;
    }
  }
  return imageData;
}

function drawFrame(){
  var w = previewCanvas.width, h = previewCanvas.height;

  // 1. Dessine le nouvel arrière-plan en premier
  if(bgImage){
    ctx.drawImage(bgImage, 0, 0, w, h);
  } else {
    ctx.fillStyle = bgColor;
    ctx.fillRect(0, 0, w, h);
  }

  // 2. Dessine la vidéo sur un canvas séparé, retire le vert, superpose par-dessus
  offCtx.drawImage(srcVideo, 0, 0, w, h);
  var frame = offCtx.getImageData(0, 0, w, h);
  var sensitivity = parseInt(document.getElementById('sensitivity').value, 10);
  applyChromaKey(frame, sensitivity);
  offCtx.putImageData(frame, 0, 0);
  ctx.drawImage(offCanvas, 0, 0);
}

function startPreviewLoop(){
  function loop(){
    if(videoReady && !srcVideo.paused){ drawFrame(); }
    animFrameId = requestAnimationFrame(loop);
  }
  loop();
}

document.getElementById('export-btn').addEventListener('click', async function(){
  var btn = this;
  btn.disabled = true;
  var statusEl = document.getElementById('export-status');
  statusEl.textContent = '⏳ Préparation de l\'exportation...';

  srcVideo.currentTime = 0;
  await new Promise(function(resolve){ srcVideo.onseeked = resolve; });
  srcVideo.play();

  var canvasStream = previewCanvas.captureStream(30);
  var combinedStream = canvasStream;
  try{
    var videoStream = srcVideo.captureStream ? srcVideo.captureStream() : null;
    if(videoStream){
      var audioTracks = videoStream.getAudioTracks();
      if(audioTracks.length){
        combinedStream = new MediaStream([canvasStream.getVideoTracks()[0], audioTracks[0]]);
      }
    }
  } catch(e){ console.log('[ChromaKey] Pas d\'audio disponible:', e); }

  var recordedChunks = [];
  var mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus') ? 'video/webm;codecs=vp9,opus' : 'video/webm';
  var recorder = new MediaRecorder(combinedStream, { mimeType: mimeType });
  recorder.ondataavailable = function(e){ if(e.data.size > 0) recordedChunks.push(e.data); };
  recorder.onstop = function(){
    var blob = new Blob(recordedChunks, { type: 'video/webm' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'video-fond-remplace.webm';
    a.click();
    statusEl.textContent = '✅ Vidéo téléchargée! (format .webm — lisible dans CapCut et la plupart des lecteurs)';
    btn.disabled = false;
  };

  recorder.start();
  statusEl.textContent = '🔴 Enregistrement en cours — attends la fin de la vidéo...';

  srcVideo.onended = function(){
    recorder.stop();
    srcVideo.loop = true;
  };
  srcVideo.loop = false;
});
</script>
</body>
</html>
